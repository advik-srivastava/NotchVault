<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data: blob: mediastream:" />
  <title>Dynamic Island</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style2.css" />
  <link rel="stylesheet" href="style3.css" />
  <link rel="stylesheet" href="style4.css" />
  <link rel="stylesheet" href="style5.css" />
  <link rel="stylesheet" href="style6.css" />
  <link rel="stylesheet" href="style7.css" />
  <link rel="stylesheet" href="style8.css" />
  <link rel="stylesheet" href="style9.css" />
</head>
<body>
  <div id="island">
    <!-- Liquid Glass: live (blurred, refracted) copy of the screen behind the island -->
    <div id="glass">
      <div id="glass-media"><video id="glass-video" muted playsinline></video><img id="glass-img" alt="" /></div>
      <canvas id="glass-canvas"></canvas>
      <div class="tint"></div>
    </div>
    <div id="glow"></div>
    <div class="ear l"></div>
    <div class="ear r"></div>
    <div id="shape"></div>
    <svg id="rim" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.08" />
          <stop offset="0.55" stop-color="#fff" stop-opacity="0.22" />
          <stop offset="1" stop-color="#fff" stop-opacity="0.55" />
        </linearGradient>
      </defs>
      <path class="glow" />
      <path class="line" />
    </svg>
    <div id="tabs"><div class="ink"></div></div>
    <div id="content"></div>
  </div>
  <script src="icons.js"></script>
  <script src="spring.js"></script>
  <script src="island.js"></script>
</body>
</html>
