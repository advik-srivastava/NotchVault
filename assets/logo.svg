<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- NotchVault app icon · Crazified Studios
       Aubergine #2A0E33 · Mulberry #5B1F5E · Orchid #8A3A8E · Champagne gold #ECD08F → #C0924A · Ivory #FFF8EA
       macOS grid: 824 px tile centred in 1024 with a soft shadow. Windows uses logo-win.svg (same art, full bleed). -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8a3a8e"/>
      <stop offset=".5" stop-color="#5b1f5e"/>
      <stop offset="1" stop-color="#2a0e33"/>
    </linearGradient>
    <radialGradient id="light" cx=".2" cy=".08" r=".75">
      <stop offset="0" stop-color="#d77fc4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d77fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx=".85" cy="1" r=".7">
      <stop offset="0" stop-color="#14061a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#14061a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1cc"/>
      <stop offset=".45" stop-color="#ecd08f"/>
      <stop offset="1" stop-color="#c0924a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7b0" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ecd08f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ecd08f" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17141b"/>
      <stop offset="1" stop-color="#050407"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#12051a" flood-opacity=".38"/></filter>
    <filter id="cast" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#12041a" flood-opacity=".55"/></filter>
    <filter id="warm" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#f6dc9c" flood-opacity=".75"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g id="art">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
    <g clip-path="url(#sq)">
      <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#depth)"/>

      <!-- the island, hanging from the top edge -->
      <g filter="url(#cast)">
        <path d="M216 100 H808 C 782 100 770 112 770 138 V462 C 770 544 708 600 628 600 H396 C 316 600 254 544 254 462 V138 C 254 112 242 100 216 100 Z" fill="url(#ink)"/>
      </g>

      <!-- face -->
      <g fill="#fff8ea" filter="url(#warm)">
        <rect x="402" y="292" width="54" height="104" rx="27"/>
        <rect x="568" y="292" width="54" height="104" rx="27"/>
      </g>
      <g transform="translate(512 434)">
        <circle cy="-6" r="20" fill="url(#gold)"/>
        <path d="M-9.5 4 L-15 40 H15 L9.5 4 Z" fill="url(#gold)"/>
      </g>
      <path d="M444 500 Q 512 546 580 500" fill="none" stroke="#fff8ea" stroke-width="26" stroke-linecap="round"/>
    </g>
    <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
</svg>
