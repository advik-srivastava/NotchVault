<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NotchVault installer art</title>
<style>
  /* Source for the Windows installer images. Rendered at 2x by headless Edge, then saved as BMP:
       ?sidebar  → 164 × 314  (Welcome and Finish pages)
       ?header   → 150 × 57   (top-right of every other page)                                      */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; font-family: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .sidebar { display: none; width: 164px; height: 314px; position: relative; color: #fff8ea; text-align: center;
    background:
      radial-gradient(90% 60% at 20% 0%, rgba(160, 70, 160, .75), transparent 70%),
      radial-gradient(90% 60% at 100% 100%, rgba(192, 146, 74, .28), transparent 70%),
      linear-gradient(170deg, #5b1f5e 0%, #2a0e33 55%, #140818 100%); }
  .sidebar .logo { position: absolute; left: 50%; top: 58px; width: 104px; height: 104px; margin-left: -52px; }
  .sidebar .name { position: absolute; left: 0; right: 0; top: 168px; font-size: 21px; font-weight: 700; letter-spacing: -.4px; }
  .sidebar .tag { position: absolute; left: 14px; right: 14px; top: 197px; font-size: 10.5px; line-height: 1.35; color: #d8c6dc; }
  .sidebar .rule { position: absolute; left: 50%; top: 246px; width: 28px; height: 2px; margin-left: -14px; border-radius: 2px; background: linear-gradient(90deg, #ecd08f, #c0924a); }
  .sidebar .by { position: absolute; left: 0; right: 0; bottom: 18px; font-size: 9.5px; color: #a99bae; }
  .sidebar .by b { color: #fff8ea; font-weight: 600; }

  .header { display: none; width: 150px; height: 57px; background: #fff; align-items: center; justify-content: flex-end; gap: 6px; padding-right: 8px; }
  .header img { width: 40px; height: 40px; }
  .header .w { font-size: 15px; font-weight: 700; letter-spacing: -.3px; color: #2a0e33; }

  body.show-sidebar .sidebar { display: block; }
  body.show-header .header { display: flex; }
</style>
</head>
<body>
  <div class="sidebar">
    <img class="logo" src="../logo.svg" alt="">
    <div class="name">NotchVault</div>
    <div class="tag">The Dynamic Island,<br>rebuilt for your desktop</div>
    <div class="rule"></div>
    <div class="by">by <b>Crazified Studios</b></div>
  </div>
  <div class="header"><img src="../logo-win.svg" alt=""><span class="w">NotchVault</span></div>
  <script>document.body.classList.add(location.search.includes('header') ? 'show-header' : 'show-sidebar');</script>
</body>
</html>
