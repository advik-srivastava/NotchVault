<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NotchVault social preview</title>
<style>
  /* GitHub repository social preview · 1280 × 640 · key content kept inside the 80 px (40 pt) safe border.
     Tokens (brand palette from the NotchVault icon):
       surface   #1C0A24 → #2A0E33   aubergine
       light     #5B1F5E / #8A3A8E   mulberry / orchid glow
       content   #FFF8EA              ivory      (17.9:1 on #1C0A24)
       secondary #D8C6DC              lilac grey (12.1:1)
       accent    #ECD08F → #C0924A    champagne gold (lives in the icon) */
  :root { --ivory: #fff8ea; --lilac: #d8c6dc; --gold: #ecd08f; --gold2: #c0924a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #1c0a24; }
  body {
    position: relative;
    font-family: "SF Pro Display", "SF Pro Text", -apple-system, "Segoe UI Variable Display", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--ivory);
    background:
      radial-gradient(70% 90% at 12% 0%, rgba(138, 58, 142, .55), transparent 60%),
      radial-gradient(60% 80% at 100% 100%, rgba(91, 31, 94, .55), transparent 65%),
      linear-gradient(160deg, #2a0e33 0%, #1c0a24 55%, #12061a 100%);
  }

  /* ---- content, all inside the safe area (80 … 1200 × 80 … 560) */
  main { position: absolute; inset: 80px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; text-align: center; padding: 22px 0 20px; }
  .brand { display: flex; align-items: center; gap: 30px; }
  .brand img { width: 176px; height: 176px; margin: -22px; }          /* the icon art has Apple's 10 % margin built in */
  .brand h1 { font-size: 120px; font-weight: 700; letter-spacing: -3.2px; line-height: 1; }
  .mid { display: flex; flex-direction: column; align-items: center; }
  .tag { font-size: 40px; font-weight: 500; letter-spacing: -.5px; color: var(--lilac); }
  .chips { list-style: none; display: flex; flex-wrap: nowrap; gap: 14px; margin-top: 30px; }
  .chips li { font-size: 22px; font-weight: 600; padding: 11px 20px; border-radius: 99px; color: #efe4f0;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
  footer { display: flex; justify-content: center; gap: 16px; font-size: 22px; font-weight: 600; color: #a99bae; padding-bottom: 2px; }
  footer b { color: var(--ivory); font-weight: 700; }
  footer .dot { color: #6e5a74; }

  /* ---- ?guides shows GitHub's crop border, like the template */
  .guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  .guides::before { content: ''; position: absolute; inset: 80px; outline: 2px solid #e5484d; }
  .show-guides .guides { display: block; }
</style>
</head>
<body>
  <main>
    <div class="brand"><img src="../logo.svg" alt=""><h1>NotchVault</h1></div>
    <div class="mid">
      <p class="tag">The Dynamic Island, rebuilt for Windows and Mac.</p>
      <ul class="chips">
        <li>Music &amp; lyrics</li><li>Phone calls</li><li>Notifications</li><li>Timers &amp; alarms</li><li>AI agents</li>
      </ul>
    </div>
    <footer><span>by <b>Crazified Studios</b></span><span class="dot">•</span><span>crazifiedstudios.com</span></footer>
  </main>

  <div class="guides"></div>
  <script>if (location.search.includes('guides')) document.body.classList.add('show-guides');</script>
</body>
</html>
